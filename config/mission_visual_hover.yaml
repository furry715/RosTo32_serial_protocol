mission:
  frame_id: camera_init
  auto_arm: true
  arm_idle_duration: 3.0
  auto_land: true
  auto_disarm: false
  default_reach_timeout: 30.0

waypoints:
  - name: takeoff_0p7
    pose: {x: 0.0, y: 0.0, z: 1.2, yaw_deg: 0.0}
    gates:
      - type: hold
        duration: 3.0

  - name: visual_hover_wait_target
    pose: {x: 2.5, y: -0.35, z: 1.2, yaw_deg: 0.0}
    gate_mode: sequential
    gates:
      - type: topic_bool
        topic: /visual_track/target_seen
        value: true
      - type: hold
        duration: 25.0
      - type: service
        service: /serial_protocol_node/release_payload
        timeout: 5.0

  - name: return_home_xy
    pose: {x: 0.0, y: 0.0, z: 1.2, yaw_deg: 0.0}
    gates:
      - type: hold
        duration: 2.0

  - name: landing_approach
    pose: {x: 0.0, y: 0.0, z: 0.4, yaw_deg: 0.0}
    gates:
      - type: hold
        duration: 2.0