mission:
  frame_id: camera_init
  auto_arm: true
  arm_idle_duration: 2.0
  auto_land: true
  auto_disarm: false
  default_reach_timeout: 30.0

waypoints:
  - name: takeoff
    pose: {x: 0.0, y: 0.0, z: 1.0, yaw_deg: 0.0}
    gates:
      - type: hold
        duration: 2.0

  - name: forward_1m
    pose: {x: 1.0, y: 0.0, z: 1.0, yaw_deg: 0.0}
    gates:
      - type: hold
        duration: 2.0

  - name: turn_right_90
    pose: {x: 1.0, y: 0.0, z: 1.0, yaw_deg: -90.0}
    gates:
      - type: hold
        duration: 2.0

  - name: landing_approach
    pose: {x: 1.0, y: 0.0, z: 0.5, yaw_deg: -90.0}
    gates:
      - type: hold
        duration: 2.0
