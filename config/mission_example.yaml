mission:
  frame_id: camera_init
  auto_arm: true
  arm_idle_duration: 3.0
  auto_land: true
  auto_disarm: false
  default_reach_timeout: 30.0

waypoints:
  - name: takeoff_0p7
    pose: {x: 0.0, y: 0.0, z: 0.8, yaw_deg: 0.0}
    gates:
      - type: hold
        duration: 2.0

  - name: right_0p5
    pose: {x: 0.0, y: -1.0, z: 0.8, yaw_deg: 0.0}
    gates:
      - type: hold
        duration: 2.0

  - name: right_0p6
    pose: {x: 1.0, y: -1.0, z: 0.8, yaw_deg: 0.0}
    gates:
      - type: hold
        duration: 2.0

  - name: right_0p7
    pose: {x: 1.0, y: -1.0, z: 0.8, yaw_deg: 180.0}
    gates:
      - type: hold
        duration: 4.0

  - name: right_0p8
    pose: {x: 1.0, y: 0.0, z: 0.8, yaw_deg: 180.0}
    gates:
      - type: hold
        duration: 2.0

  - name: right_0p8
    pose: {x: 0.0, y: 0.0, z: 0.8, yaw_deg: 180.0}
    gates:
      - type: hold
        duration: 2.0

  - name: final_down_0p3
    pose: {x: 0.0, y: 0.0, z: 0.4, yaw_deg: 180.0}
    gates:
      - type: hold
        duration: 2.0
